<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 650" width="100%" height="100%">
  <defs>
    <!-- Gradiente de iluminação corporal azul royal -->
    <linearGradient id="blueBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#216ED4" />
      <stop offset="45%" stop-color="#1555B8" />
      <stop offset="85%" stop-color="#0E4299" />
      <stop offset="100%" stop-color="#093175" />
    </linearGradient>

    <!-- Gradiente de sombra lateral -->
    <linearGradient id="blueShadow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(0,0,0,0.22)" />
      <stop offset="15%" stop-color="rgba(0,0,0,0)" />
      <stop offset="85%" stop-color="rgba(0,0,0,0)" />
      <stop offset="100%" stop-color="rgba(0,0,0,0.25)" />
    </linearGradient>

    <!-- Gradiente da manga esquerda -->
    <linearGradient id="blueLeftSleeve" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#216ED4" />
      <stop offset="100%" stop-color="#0B3782" />
    </linearGradient>

    <!-- Gradiente da manga direita -->
    <linearGradient id="blueRightSleeve" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#216ED4" />
      <stop offset="100%" stop-color="#0B3782" />
    </linearGradient>

    <!-- Branco atlético de acabamento -->
    <linearGradient id="whiteTrim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E2E7ED" />
      <stop offset="50%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#D5DCE4" />
    </linearGradient>

    <!-- Filtro de sombra suave do produto -->
    <filter id="dropShadowBlue" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#061A33" flood-opacity="0.22" />
    </filter>

    <!-- Padrão sutil micro-dry respirável -->
    <pattern id="meshPatternBlue" width="10" height="10" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.8" fill="#4B8BE8" opacity="0.15" />
      <circle cx="7" cy="7" r="0.8" fill="#4B8BE8" opacity="0.15" />
    </pattern>
  </defs>

  <g filter="url(#dropShadowBlue)">
    <!-- Manga Esquerda -->
    <path d="M 205,142 L 80,240 C 72,246 64,258 70,270 L 115,355 C 120,364 133,366 142,360 L 210,305 L 205,142 Z"
          fill="url(#blueLeftSleeve)" stroke="#092B66" stroke-width="1.5" />
    <!-- Punho da Manga Esquerda (Branco/Verde) -->
    <path d="M 70,270 L 115,355 C 120,364 126,365 133,363 L 126,346 L 85,268 C 78,255 71,262 70,270 Z"
          fill="url(#whiteTrim)" />

    <!-- Manga Direita -->
    <path d="M 395,142 L 520,240 C 528,246 536,258 530,270 L 485,355 C 480,364 467,366 458,360 L 390,305 L 395,142 Z"
          fill="url(#blueRightSleeve)" stroke="#092B66" stroke-width="1.5" />
    <!-- Punho da Manga Direita (Branco/Verde) -->
    <path d="M 530,270 L 485,355 C 480,364 474,365 467,363 L 474,346 L 515,268 C 522,255 529,262 530,270 Z"
          fill="url(#whiteTrim)" />

    <!-- Corpo Principal da Camiseta -->
    <path d="M 205,142 
             C 240,165 360,165 395,142 
             L 420,280 
             L 405,540 
             C 405,556 390,565 370,565 
             L 230,565 
             C 210,565 195,556 195,540 
             L 180,280 
             Z"
          fill="url(#blueBody)" stroke="#092B66" stroke-width="1.5" />

    <!-- Textura respirável Micro-Dry sobreposta -->
    <path d="M 205,142 C 240,165 360,165 395,142 L 420,280 L 405,540 C 405,556 390,565 370,565 L 230,565 C 210,565 195,556 195,540 L 180,280 Z"
          fill="url(#meshPatternBlue)" />

    <!-- Sombreamento de Profundidade Lateral -->
    <path d="M 205,142 C 240,165 360,165 395,142 L 420,280 L 405,540 C 405,556 390,565 370,565 L 230,565 C 210,565 195,556 195,540 L 180,280 Z"
          fill="url(#blueShadow)" />

    <!-- Costuras esportivas anatômicas laterais -->
    <path d="M 220,180 Q 235,340 215,555" fill="none" stroke="#2B7FE8" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.45" />
    <path d="M 380,180 Q 365,340 385,555" fill="none" stroke="#2B7FE8" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.45" />

    <!-- Gola Traseira interna -->
    <path d="M 245,140 C 275,122 325,122 355,140 C 330,152 270,152 245,140 Z"
          fill="#082352" />
    <!-- Etiqueta interna sutil -->
    <rect x="286" y="132" width="28" height="15" rx="2" fill="#EAEAEA" opacity="0.85" />
    <text x="300" y="142" font-family="sans-serif" font-size="7" font-weight="bold" fill="#333" text-anchor="middle">G / GG</text>

    <!-- Gola Frontal Canelada (Branco com friso sutil) -->
    <path d="M 240,140 C 270,195 330,195 360,140 C 342,168 258,168 240,140 Z"
          fill="url(#whiteTrim)" stroke="#B0B9C2" stroke-width="1" />

    <!-- Friso fino de contraste azul royal na gola -->
    <path d="M 252,152 C 276,182 324,182 348,152" fill="none" stroke="#1555B8" stroke-width="1.5" opacity="0.8" />

    <!-- Barra inferior reforçada -->
    <path d="M 197,552 C 250,560 350,560 403,552" fill="none" stroke="#082963" stroke-width="2" opacity="0.5" />
    <path d="M 196,558 C 250,566 350,566 404,558" fill="none" stroke="#082963" stroke-width="1" opacity="0.4" />
  </g>
</svg>
